<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="青畦">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#7cb342">
<title>青畦</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 標題 -->
  <section id="screen-title" class="screen">
    <div class="title-art" aria-hidden="true">
      <canvas id="titleCanvas" width="280" height="140"></canvas>
    </div>
    <h1>青畦</h1>
    <p class="subtitle">自動種田 · 望住村慢慢好</p>
    <button type="button" class="btn primary" id="btn-start">開始新局</button>
    <button type="button" class="btn" id="btn-continue" hidden>繼續</button>
    <button type="button" class="btn ghost" id="btn-settings-title">設定</button>
    <p class="hint">點 AUTO，村會自己播、澆、收、賣</p>
  </section>

  <!-- 遊戲 -->
  <section id="screen-game" class="screen" hidden>
    <header class="hud">
      <div class="hud-left">
        <span class="pill" id="hud-day">春 · 第1日</span>
        <span class="pill gold" id="hud-gold">💰 80</span>
        <span class="pill food" id="hud-food">🌾 12</span>
      </div>
      <div class="hud-right">
        <button type="button" class="btn-icon" id="btn-menu" title="選單">☰</button>
      </div>
    </header>

    <div class="farm-wrap">
      <canvas id="farm" width="360" height="420"></canvas>
      <div class="toast" id="toast" hidden></div>
    </div>

    <div class="status-bar">
      <span id="status-text">點田操作，或開 AUTO</span>
      <span id="auto-label" class="auto-off">AUTO 關</span>
    </div>

    <div class="directives" role="group" aria-label="方針">
      <button type="button" class="dir active" data-dir="grain">多種糧</button>
      <button type="button" class="dir" data-dir="money">多賺錢</button>
      <button type="button" class="dir" data-dir="expand">擴田優先</button>
      <button type="button" class="dir" data-dir="winter">存糧過冬</button>
    </div>

    <div class="controls">
      <button type="button" class="btn auto-btn" id="btn-auto">AUTO</button>
      <button type="button" class="btn" id="btn-water-all">全澆</button>
      <button type="button" class="btn" id="btn-harvest">收成</button>
      <button type="button" class="btn" id="btn-sell">賣出</button>
      <button type="button" class="btn" id="btn-expand">擴田</button>
    </div>

    <div class="crop-pick" id="crop-pick">
      <span class="label">種子</span>
      <button type="button" class="crop-btn active" data-crop="rice">稻</button>
      <button type="button" class="crop-btn" data-crop="veg">菜</button>
      <button type="button" class="crop-btn" data-crop="flower">花</button>
      <button type="button" class="crop-btn" data-crop="wheat">麥</button>
    </div>
  </section>

  <!-- 事件 -->
  <div id="modal-event" class="modal" hidden>
    <div class="modal-card">
      <h2 id="event-title">事件</h2>
      <p id="event-body"></p>
      <div class="modal-actions" id="event-actions"></div>
    </div>
  </div>

  <!-- 選單 -->
  <div id="modal-menu" class="modal" hidden>
    <div class="modal-card">
      <h2>選單</h2>
      <button type="button" class="btn" id="btn-save">立即存檔</button>
      <button type="button" class="btn" id="btn-settings-game">設定</button>
      <button type="button" class="btn" id="btn-title">回標題</button>
      <button type="button" class="btn ghost" id="btn-close-menu">關閉</button>
    </div>
  </div>

  <!-- 設定 stub -->
  <div id="modal-settings" class="modal" hidden>
    <div class="modal-card">
      <h2>設定</h2>
      <label class="field">AI 供應商（預留）
        <select id="set-provider">
          <option value="none">離線規則 AUTO（預設）</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </label>
      <label class="field">模型
        <select id="set-model">
          <option value="deepseek-chat">deepseek-chat（快）</option>
          <option value="deepseek-reasoner">deepseek-reasoner（強）</option>
        </select>
      </label>
      <label class="field">API Key（只存本機）
        <input type="password" id="set-key" placeholder="sk-…" autocomplete="off">
      </label>
      <p class="tiny">v1 用規則 AUTO 已夠玩；Key 留給之後 AI 方針。</p>
      <button type="button" class="btn primary" id="btn-save-settings">儲存</button>
      <button type="button" class="btn ghost" id="btn-close-settings">關閉</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="青畦">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#5d8a3a">
<title>青畦</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 標題 -->
  <section id="screen-title" class="screen">
    <div class="title-bg" aria-hidden="true">
      <picture>
        <source srcset="assets/bg_village.webp" type="image/webp">
        <img src="assets/bg_village.jpg" alt="" decoding="async">
      </picture>
      <div class="title-bg-shade"></div>
    </div>
    <div class="title-content">
      <h1>青畦</h1>
      <p class="subtitle">種田 · 挖礦 · 釣魚 · AUTO</p>
      <button type="button" class="btn primary" id="btn-start">開始新局</button>
      <button type="button" class="btn" id="btn-continue" hidden>繼續</button>
      <button type="button" class="btn ghost" id="btn-settings-title">設定</button>
      <p class="hint">開 AUTO，跟住場景自動種／挖／釣</p>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="screen-game" class="screen" hidden>
    <header class="hud">
      <div class="hud-left">
        <button type="button" class="hud-btn" id="btn-bag" title="背包">BAG</button>
        <button type="button" class="hud-btn" id="btn-quest" title="任務">
          QUEST<span class="quest-dot" id="quest-dot" hidden></span>
        </button>
      </div>
      <div class="hud-mid">
        <span class="pill" id="hud-day">春 · 第1日</span>
        <span class="pill gold" id="hud-gold">💰 80</span>
        <span class="pill food" id="hud-food">🌾 12</span>
        <span class="pill stam" id="hud-stam">⚡ 100</span>
      </div>
      <div class="hud-right">
        <button type="button" class="btn-icon" id="btn-menu" title="選單">☰</button>
      </div>
    </header>

    <nav class="mode-tabs" role="tablist" aria-label="場景">
      <button type="button" class="mode-tab active" data-mode="farm">田畦</button>
      <button type="button" class="mode-tab" data-mode="village">村落</button>
      <button type="button" class="mode-tab" data-mode="mine">礦洞</button>
      <button type="button" class="mode-tab" data-mode="pond">魚塘</button>
    </nav>

    <div class="scene-wrap">
      <!-- 村落／礦洞／魚塘共用大場景 -->
      <div class="adventure-scene" id="adventure-scene">
        <picture id="scene-pic">
          <source id="scene-webp" srcset="assets/bg_village.webp" type="image/webp">
          <img id="scene-img" src="assets/bg_village.jpg" alt="場景" class="scene-img" decoding="async">
        </picture>
        <div class="season-tint" id="season-tint" data-season="0"></div>
        <div class="scene-caption" id="scene-caption">春光滿村</div>
        <div class="scene-action-hint" id="scene-hint"></div>
        <div class="toast" id="toast" hidden></div>

        <!-- 虛擬操作（礦／釣） -->
        <div class="dpad" id="dpad" hidden>
          <button type="button" class="dpad-btn" data-dir="up">▲</button>
          <button type="button" class="dpad-btn" data-dir="left">◀</button>
          <button type="button" class="dpad-btn" data-dir="right">▶</button>
          <button type="button" class="dpad-btn" data-dir="down">▼</button>
        </div>
        <div class="action-cluster" id="action-cluster" hidden>
          <button type="button" class="act-btn" id="btn-attack" title="攻擊">攻</button>
          <button type="button" class="act-btn" id="btn-skill" title="技能">技</button>
          <button type="button" class="act-btn primary" id="btn-interact" title="互動">互</button>
        </div>
      </div>

      <!-- 田畦專用 -->
      <div class="plot-card" id="plot-card">
        <div class="plot-card-head">
          <span class="plot-card-title">田畦</span>
          <span class="plot-card-hint" id="plot-hint">點畦操作 · AUTO 亦會自動</span>
        </div>
        <div class="plot-canvas-wrap">
          <picture class="plot-bg" aria-hidden="true">
            <source srcset="assets/bg_fields.webp" type="image/webp">
            <img src="assets/bg_fields.jpg" alt="" decoding="async">
          </picture>
          <canvas id="farm" width="360" height="168"></canvas>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <span id="status-text">點田操作，或開 AUTO</span>
      <span id="auto-label" class="auto-off">AUTO 關</span>
    </div>

    <!-- 田畦方針／種子 -->
    <div class="farm-only" id="farm-panel">
      <div class="directives" role="group" aria-label="方針">
        <button type="button" class="dir active" data-dir="grain">多種糧</button>
        <button type="button" class="dir" data-dir="money">多賺錢</button>
        <button type="button" class="dir" data-dir="expand">擴田優先</button>
        <button type="button" class="dir" data-dir="winter">存糧過冬</button>
      </div>
      <div class="controls">
        <button type="button" class="btn auto-btn" id="btn-auto">AUTO</button>
        <button type="button" class="btn" id="btn-water-all">全澆</button>
        <button type="button" class="btn" id="btn-harvest">收成</button>
        <button type="button" class="btn" id="btn-sell">賣出</button>
        <button type="button" class="btn" id="btn-expand">擴田</button>
      </div>
      <div class="crop-pick" id="crop-pick">
        <span class="label">種子</span>
        <button type="button" class="crop-btn active" data-crop="rice">稻</button>
        <button type="button" class="crop-btn" data-crop="veg">菜</button>
        <button type="button" class="crop-btn" data-crop="flower">花</button>
        <button type="button" class="crop-btn" data-crop="wheat">麥</button>
      </div>
    </div>

    <!-- 村落面板 -->
    <div class="mode-panel" id="village-panel" hidden>
      <p class="mode-blurb">村落景色 · 可去田畦耕作，或進礦洞、魚塘。</p>
      <div class="controls village-controls">
        <button type="button" class="btn auto-btn" id="btn-auto-v">AUTO</button>
        <button type="button" class="btn" data-goto="farm">去田畦</button>
        <button type="button" class="btn" data-goto="mine">進礦洞</button>
        <button type="button" class="btn" data-goto="pond">去魚塘</button>
      </div>
    </div>

    <!-- 礦洞面板 -->
    <div class="mode-panel" id="mine-panel" hidden>
      <div class="mine-stats">
        <span id="mine-ore-label">礦石 0</span>
        <span id="mine-goldore-label">金礦 0</span>
        <span id="mine-cd-label">就緒</span>
      </div>
      <div class="controls mine-controls">
        <button type="button" class="btn auto-btn" id="btn-auto-m">AUTO</button>
        <button type="button" class="btn primary" id="btn-mine">開挖</button>
        <button type="button" class="btn" id="btn-sell-ore">賣礦</button>
        <button type="button" class="btn" id="btn-rest">歇息 +體力</button>
      </div>
    </div>

    <!-- 魚塘面板 -->
    <div class="mode-panel" id="pond-panel" hidden>
      <div class="pond-stats">
        <span id="pond-fish-label">魚 0</span>
        <span id="pond-rare-label">珍魚 0</span>
        <span id="pond-cd-label">就緒</span>
      </div>
      <div class="controls pond-controls">
        <button type="button" class="btn auto-btn" id="btn-auto-p">AUTO</button>
        <button type="button" class="btn primary" id="btn-fish">拋竿</button>
        <button type="button" class="btn" id="btn-sell-fish">賣魚</button>
        <button type="button" class="btn" id="btn-rest-p">歇息 +體力</button>
      </div>
    </div>
  </section>

  <!-- 背包 -->
  <div id="modal-bag" class="modal" hidden>
    <div class="modal-card wide">
      <h2>背包</h2>
      <div class="bag-grid" id="bag-grid"></div>
      <div class="modal-actions row">
        <button type="button" class="btn primary" id="btn-bag-sell-all">全部賣掉</button>
        <button type="button" class="btn ghost" id="btn-close-bag">關閉</button>
      </div>
    </div>
  </div>

  <!-- 任務 -->
  <div id="modal-quest" class="modal" hidden>
    <div class="modal-card wide">
      <h2>任務</h2>
      <div class="quest-list" id="quest-list"></div>
      <button type="button" class="btn ghost" id="btn-close-quest">關閉</button>
    </div>
  </div>

  <!-- 成就 -->
  <div id="modal-achieve" class="modal" hidden>
    <div class="modal-card achieve-card">
      <div class="achieve-badge">🏆</div>
      <h2>新成就解鎖</h2>
      <p id="achieve-title" class="achieve-title"></p>
      <p id="achieve-body"></p>
      <button type="button" class="btn primary" id="btn-close-achieve">太好了</button>
    </div>
  </div>

  <!-- 事件 -->
  <div id="modal-event" class="modal" hidden>
    <div class="modal-card">
      <h2 id="event-title">事件</h2>
      <p id="event-body"></p>
      <div class="modal-actions" id="event-actions"></div>
    </div>
  </div>

  <!-- 選單 -->
  <div id="modal-menu" class="modal" hidden>
    <div class="modal-card">
      <h2>選單</h2>
      <button type="button" class="btn" id="btn-save">立即存檔</button>
      <button type="button" class="btn" id="btn-settings-game">設定</button>
      <button type="button" class="btn" id="btn-title">回標題</button>
      <button type="button" class="btn ghost" id="btn-close-menu">關閉</button>
    </div>
  </div>

  <!-- 設定 -->
  <div id="modal-settings" class="modal" hidden>
    <div class="modal-card">
      <h2>設定</h2>
      <label class="field">AI 供應商（預留）
        <select id="set-provider">
          <option value="none">離線規則 AUTO（預設）</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </label>
      <label class="field">模型
        <select id="set-model">
          <option value="deepseek-chat">deepseek-chat（快）</option>
          <option value="deepseek-reasoner">deepseek-reasoner（強）</option>
        </select>
      </label>
      <label class="field">API Key（只存本機）
        <input type="password" id="set-key" placeholder="sk-…" autocomplete="off">
      </label>
      <p class="tiny">v2 用規則 AUTO 跟場景自動種／挖／釣；Key 留給之後 AI 方針。</p>
      <button type="button" class="btn primary" id="btn-save-settings">儲存</button>
      <button type="button" class="btn ghost" id="btn-close-settings">關閉</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
